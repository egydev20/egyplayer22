name: Rebuild and Sign EgyPlayer

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool

      - name: Rebuild APK
        run: |
          apktool b . -o egyplayer-fixed.apk

      - name: Sign APK with Debug Key
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keypass android -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000
          jarsigner -keystore debug.keystore -storepass android -keypass android egyplayer-fixed.apk androiddebugkey

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: egyplayer-working
          path: egyplayer-fixed.apk
