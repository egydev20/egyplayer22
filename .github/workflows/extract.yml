name: Extract API & Source from APK
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'ضع رابط تحميل الـ APK المباشر هنا'
        required: true

jobs:
  decompile_and_find_api:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Download APK from URL
        run: |
          wget -O app.apk "${{ github.event.inputs.apk_url }}"

      - name: 2. Download & Setup JADX
        run: |
          wget -q https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip
          unzip -q jadx-1.5.0.zip -d jadx
          chmod +x jadx/bin/jadx

      - name: 3. Decompile APK
        run: |
          ./jadx/bin/jadx -d extracted_code app.apk || true

      - name: 4. Search for API URLs & Endpoints
        run: |
          echo "=== 1. جميع الروابط الموجودة في التطبيق (HTTP/HTTPS) ===" > api_report.txt
          grep -rnE "http://|https://" extracted_code/sources/ 2>/dev/null | grep -v "schemas.android.com" | grep -v "www.w3.org" | grep -v "google.com" | grep -v "apache.org" >> api_report.txt || true
          
          echo -e "\n\n=== 2. ملفات الإعدادات والـ API ===" >> api_report.txt
          grep -rnE "@GET|@POST|@FormUrlEncoded|mac_address|device_key|expire|playlist" extracted_code/sources/ 2>/dev/null >> api_report.txt || true

          echo -e "\n\n=== 3. الروابط المخزنة في ملفات Strings.xml ===" >> api_report.txt
          grep -rnE "http://|https://" extracted_code/resources/ 2>/dev/null | grep -v "schemas.android.com" >> api_report.txt || true

      - name: 5. Upload API Report
        uses: actions/upload-artifact@v4
        with:
          name: 1-API-Report-Text
          path: api_report.txt

      - name: 6. Upload Full Source Code
        uses: actions/upload-artifact@v4
        with:
          name: 2-Full-Source-Code
          path: extracted_code/sources/
